name: BE container security scan

on:
  push:
    branches:
      - main
      - master
      - feature/**
  pull_request:
  schedule:
    - cron: '57 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build BE image
        run: docker build --file dockerfile --tag familiez-be:ci .
      - name: Scan BE image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: familiez-be:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
